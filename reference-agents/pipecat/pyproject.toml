[project]
name = "cekura-benchmark"
version = "0.1.0"
description = "Voice AI bot built with Pipecat"
requires-python = ">=3.11"
dependencies = [
    "cekura[pipecat]>=1.6.2",
    "pipecat-ai[cartesia,daily,deepgram,openai,runner,silero,webrtc,websocket]>=1.6.0",
    "pipecatcloud",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]
