[project]
name = "s2s-human-bench"
version = "0.1.0"
description = "Speech-to-speech benchmark with real recorded callers: call scoring, ELO and the website's data files"
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
dev = ["pytest==9.0.3"]

[project.scripts]
s2s-human-bench = "s2s_human_bench.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s2s_human_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
# metrics/ holds the exact code deployed as a Cekura metric, built by `s2s-human-bench task-metric`
extend-exclude = ["metrics"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["s2s_human_bench", "conftest"]
