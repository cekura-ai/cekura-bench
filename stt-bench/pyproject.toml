[project]
name = "stt-bench"
version = "0.1.0"
description = "Reproducible, real-time streaming speech-to-text benchmark"
requires-python = ">=3.12,<3.14"
dependencies = [
  "jiwer==4.0.0",
  "whisper-normalizer==0.1.12",
  "numpy==2.2.6",
  "soundfile==0.13.1",
  "websockets==15.0.1",
  "webrtcvad-wheels==2.0.14",
  "python-dotenv==1.1.1",
  "matplotlib==3.10.3",
  "datasets==4.8.5",
  "google-cloud-speech==2.40.0",
]

[dependency-groups]
dev = ["pytest==8.4.1"]

[project.optional-dependencies]
turn-preparation = ["silero-vad==6.2.1"]

[project.scripts]
stt-bench = "stt_bench.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
