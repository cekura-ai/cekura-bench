[project]
name = "tts-bench"
version = "0.1.0"
description = "Text-to-speech services measured at their own interface: first audio, playout, cancel, continuation and round-trip accuracy"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy==2.5.3",
  "websockets==17.1",
  "aiohttp==3.14.3",
  "python-dotenv==1.2.3",
  "whisper-normalizer==0.1.15",
  "jiwer==4.0.0",
  "soundfile==0.14.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
